<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>هرمس چت</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:var(--tg-theme-bg-color,#0a0a0f);
--bg2:var(--tg-theme-secondary-bg-color,#12121a);
--bg3:var(--tg-theme-secondary-bg-color,#1a1a2e);
--accent:var(--tg-theme-button-color,#7c3aed);
--text:var(--tg-theme-text-color,#e2e8f0);
--text2:var(--tg-theme-hint-color,#94a3b8);
--text3:#64748b;
--border:var(--tg-theme-hint-color,#1e293b);
--btn-text:var(--tg-theme-button-text-color,#fff);
--green:#10b981;--red:#ef4444;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* Settings */
.settings-page{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
.settings-page.active{display:flex}
.settings-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.settings-back{width:36px;height:36px;border:none;background:var(--bg3);border-radius:50%;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.settings-title{font-size:17px;font-weight:700}
.settings-body{flex:1;overflow-y:auto;padding:16px}
.settings-body label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;margin-top:16px}
.settings-body label:first-child{margin-top:0}
.settings-body input,.settings-body select,.settings-body textarea{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;direction:ltr;text-align:left;outline:none;transition:border .2s}
.settings-body input:focus,.settings-body select:focus,.settings-body textarea:focus{border-color:var(--accent)}
.settings-body textarea{direction:rtl;text-align:right;resize:vertical;min-height:60px;font-family:inherit}
.hint{font-size:11px;color:var(--text3);margin-top:4px}
.save-btn{width:100%;padding:14px;margin-top:20px;border:none;border-radius:12px;background:var(--accent);color:var(--btn-text);font-size:15px;font-weight:600;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--btn-text);padding:10px 20px;border-radius:12px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* App */
.app{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* Header */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-info{flex:1}
.header-name{font-size:16px;font-weight:700;color:var(--text)}
.header-status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:4px}
.header-status::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
.header-actions{display:flex;gap:4px}
.header-btn{width:38px;height:38px;border:none;background:var(--bg3);border-radius:50%;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header-btn:hover,.header-btn:active{background:var(--border);color:var(--text)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{max-width:82%;padding:10px 14px;font-size:14px;line-height:1.7;word-wrap:break-word;white-space:pre-wrap}
.msg.user{background:var(--accent);color:var(--btn-text);border-radius:16px 16px 4px 16px;align-self:flex-start;margin-bottom:2px}
.msg.bot{background:var(--bg3);color:var(--text);border-radius:16px 16px 16px 4px;border:1px solid var(--border);align-self:flex-end;margin-bottom:2px}
.msg time{display:block;font-size:10px;color:rgba(255,255,255,.5);margin-top:4px;text-align:left}
.msg.bot time{color:var(--text3)}

/* Welcome */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:32px;gap:16px}
.welcome-icon{font-size:64px;animation:float 3s ease-in-out infinite}
.welcome h2{font-size:22px;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:var(--text2);font-size:14px;max-width:300px;line-height:1.8}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.suggestion{padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
.suggestion:hover,.suggestion:active{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* Typing */
.typing{display:flex;gap:4px;padding:12px 16px;align-items:center;justify-content:flex-end}
.typing-dot{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:typing 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* Input */
.input-area{background:var(--bg2);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-wrap{flex:1;display:flex;align-items:flex-end;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:4px 8px;transition:border .2s}
.input-wrap:focus-within{border-color:var(--accent)}
.input-wrap textarea{flex:1;background:none;border:none;color:var(--text);font-size:14px;line-height:1.6;padding:8px 4px;resize:none;outline:none;max-height:100px;font-family:inherit;direction:rtl}
.input-wrap textarea::placeholder{color:var(--text3)}
.send-btn{width:42px;height:42px;border:none;border-radius:50%;background:var(--accent);color:var(--btn-text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.send-btn svg{width:20px;height:20px}

/* Markdown */
.msg.bot code{background:rgba(124,58,237,.2);padding:1px 5px;border-radius:4px;font-size:13px;font-family:'Fira Code',monospace}
.msg.bot pre{background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:12px}
.msg.bot pre code{background:none;padding:0}
.msg.bot strong{color:var(--accent)}
.msg.bot a{color:var(--accent);text-decoration:underline}
.msg.bot ul,.msg.bot ol{padding-right:16px;margin:4px 0}
.msg{unicode-bidi:plaintext}
</style>
</head>
<body>

<!-- Settings Page -->
<div class="settings-page" id="settingsPage">
  <div class="settings-header">
    <button class="settings-back" onclick="closeSettings()">→</button>
    <div class="settings-title">⚙️ تنظیمات</div>
  </div>
  <div class="settings-body">
    <label>آدرس API</label>
    <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions">
    <div class="hint">آدرس سرور OpenAI-compatible</div>

    <label>کلید API</label>
    <input type="password" id="apiKey" placeholder="sk-...">

    <label>مدل</label>
    <select id="model">
      <option value="gpt-4o-mini">GPT-4o Mini (سریع و ارزان)</option>
      <option value="gpt-4o">GPT-4o (بهترین)</option>
      <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
      <option value="deepseek-chat">DeepSeek Chat</option>
      <option value="custom">سفارشی...</option>
    </select>
    <input type="text" id="customModel" placeholder="نام مدل" style="display:none;margin-top:8px">

    <label>پرامپت سیستم</label>
    <textarea id="systemPrompt" rows="3">تو هرمس هستی، یه دستیار هوش مصنوعی مهربان و باهوش. به فارسی جواب بده.</textarea>

    <button class="save-btn" onclick="saveSettings()">ذخیره</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- App -->
<div class="app">
  <!-- Header with settings button -->
  <div class="header">
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <div class="header-name">هرمس</div>
      <div class="header-status">آنلاین</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="clearChat()" title="پاک کردن چت">🗑️</button>
      <button class="header-btn" onclick="openSettings()" title="تنظیمات">⚙️</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>سلام! من هرمس‌ام</h2>
      <p>هر سوالی داری بپرس 👇</p>
      <div class="suggestions">
        <div class="suggestion" onclick="sendSuggestion('سلام! حالت چطوره؟')">سلام! 👋</div>
        <div class="suggestion" onclick="sendSuggestion('یه جک بگو')">یه جک بگو 😂</div>
        <div class="suggestion" onclick="sendSuggestion('درباره خودت بگو')">درباره تو 🤔</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="پیامتو بنویس..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('bg_color'); }

let messages = JSON.parse(localStorage.getItem('hermes-mini-messages') || '[]');
let settings = JSON.parse(localStorage.getItem('hermes-mini-settings') || '{}');

document.addEventListener('DOMContentLoaded', () => {
  loadSettings(); renderMessages();
  const input = document.getElementById('input');
  input.addEventListener('input', () => { document.getElementById('sendBtn').disabled = !input.value.trim(); });
  document.getElementById('model').addEventListener('change', (e) => {
    document.getElementById('customModel').style.display = e.target.value === 'custom' ? 'block' : 'none';
  });
});

function loadSettings() {
  document.getElementById('apiUrl').value = settings.apiUrl || 'https://api.openai.com/v1/chat/completions';
  document.getElementById('apiKey').value = settings.apiKey || '';
  document.getElementById('model').value = settings.model || 'gpt-4o-mini';
  document.getElementById('systemPrompt').value = settings.systemPrompt || 'تو هرمس هستی، یه دستیار هوش مصنوعی مهربان و باهوش. به فارسی جواب بده.';
  if (settings.model === 'custom') {
    document.getElementById('customModel').style.display = 'block';
    document.getElementById('customModel').value = settings.customModel || '';
  }
}

function openSettings() { document.getElementById('settingsPage').classList.add('active'); }
function closeSettings() { document.getElementById('settingsPage').classList.remove('active'); }

function saveSettings() {
  settings = {
    apiUrl: document.getElementById('apiUrl').value,
    apiKey: document.getElementById('apiKey').value,
    model: document.getElementById('model').value,
    customModel: document.getElementById('customModel').value,
    systemPrompt: document.getElementById('systemPrompt').value,
  };
  localStorage.setItem('hermes-mini-settings', JSON.stringify(settings));
  closeSettings();
  showToast('ذخیره شد ✅');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
  if (tg) tg.HapticFeedback.notificationOccurred('success');
}

function getNow() { return new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }); }

function renderMessages() {
  const el = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (messages.length === 0) { welcome.style.display = 'flex'; el.innerHTML = ''; el.appendChild(welcome); return; }
  welcome.style.display = 'none'; el.innerHTML = '';
  messages.forEach((msg) => {
    const bubble = document.createElement('div');
    bubble.className = `msg ${msg.role}`;
    bubble.innerHTML = formatText(msg.content);
    if (msg.time) { const time = document.createElement('time'); time.textContent = msg.time; bubble.appendChild(time); }
    el.appendChild(bubble);
  });
  el.scrollTop = el.scrollHeight;
}

function formatText(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/^### (.+)$/gm, '<strong>$1</strong>')
    .replace(/^## (.+)$/gm, '<strong>$1</strong>')
    .replace(/^# (.+)$/gm, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '• $1')
    .replace(/\n/g, '<br>');
}

function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (!settings.apiKey) { openSettings(); showToast('تنظیمات رو کامل کن! ⚙️'); return; }
  document.getElementById('welcome').style.display = 'none';
  messages.push({ role: 'user', content: text, time: getNow() });
  localStorage.setItem('hermes-mini-messages', JSON.stringify(messages));
  renderMessages();
  input.value = ''; input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  showTyping(); callAI(text);
}

function sendSuggestion(text) {
  document.getElementById('input').value = text;
  document.getElementById('sendBtn').disabled = false;
  sendMessage();
}

function showTyping() {
  const el = document.getElementById('messages');
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.id = 'typing';
  typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  el.appendChild(typing); el.scrollTop = el.scrollHeight;
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

async function callAI(userText) {
  const model = settings.model === 'custom' ? settings.customModel : settings.model;
  const apiMessages = [
    { role: 'system', content: settings.systemPrompt },
    ...messages.slice(-20).map(m => ({ role: m.role, content: m.content }))
  ];
  try {
    const res = await fetch(settings.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.apiKey}` },
      body: JSON.stringify({ model, messages: apiMessages, max_tokens: 2048, temperature: 0.7 }),
    });
    if (!res.ok) throw new Error(`خطای ${res.status}`);
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'جوابی دریافت نشد 🤔';
    hideTyping();
    messages.push({ role: 'bot', content: reply, time: getNow() });
    localStorage.setItem('hermes-mini-messages', JSON.stringify(messages));
    renderMessages();
    if (tg) tg.HapticFeedback.notificationOccurred('success');
  } catch (err) {
    hideTyping();
    messages.push({ role: 'bot', content: `❌ خطا: ${err.message}`, time: getNow() });
    renderMessages();
  }
}

function clearChat() {
  if (messages.length === 0) return;
  messages = []; localStorage.removeItem('hermes-mini-messages'); renderMessages();
}

function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
</script>
</body>
</html>
